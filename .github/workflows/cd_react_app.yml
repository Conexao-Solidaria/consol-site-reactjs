name: CD React App

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with: 
          node-version: '20'

      - name: Run npm install
        run: npm install

      - name: Run npm build
        run: CI=false npm run build

      - name: Upload GitHub build artifacts 
        uses: actions/upload-artifact@v4 
        with: 
          name: build-artifacts 
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Recover uploaded build
        uses: actions/download-artifact@v4
        with: 
          name: build-artifacts
          path: build
          
      - name: Generate .pem and change key permissions
        id: geracao-arquivo-pem
        run: |
          echo "${{ secrets.DEPLOY_KEY }}" >> $HOME/${{ secrets.NOME_ARQUIVO_PEM }}
          chmod 400 $HOME/${{ secrets.NOME_ARQUIVO_PEM }}

      - name: Send build files to EC2 
        uses: appleboy/scp-action@master
        with: 
          host: ${{ secrets.DEPLOY_HOST_1 }} 
          username: ubuntu
          key: ${{ secrets.DEPLOY_KEY }} 
          source: "./build/**" 
          target: "/home/ubuntu/consol-reactjs"
